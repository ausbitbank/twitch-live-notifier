<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Twitch Live to Discord</title>
  <link rel="icon" href="/static/icon.png">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="/static/icon.png" alt="">
        <div class="brand-copy">
          <strong>Twitch Live</strong>
          <span>to Discord</span>
        </div>
      </div>

      <nav class="nav" aria-label="Main navigation">
        <button class="nav-item is-active" data-view="overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
          <span>Overview</span>
        </button>
        <button class="nav-item" data-view="streamers">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Streamers</span>
          <span class="nav-count" id="nav-streamer-count">0</span>
        </button>
        <button class="nav-item" data-view="destinations">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          <span>Destinations</span>
          <span class="nav-count" id="nav-webhook-count">0</span>
        </button>
        <button class="nav-item" data-view="history">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.64-6.36"/><path d="M3 3v6h6"/><path d="M12 7v5l3 2"/></svg>
          <span>History</span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6h.08a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.08a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>
          <span>Settings</span>
        </button>
      </nav>

      <div class="sidebar-card">
        <div class="monitor-pill" id="monitor-pill"><span class="dot"></span><span>Loading…</span></div>
        <p>Close this browser tab anytime — alerts keep running from the tray.</p>
      </div>

      <div class="sidebar-footer">
        <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        </button>
        <span class="version" id="app-version">v2.4.0</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-heading">
          <h1 id="page-title">Overview</h1>
          <p id="page-subtitle">Your community's live alerts at a glance.</p>
        </div>
        <div class="top-actions" id="top-actions"></div>
      </header>

      <section class="view" id="view-overview"></section>
      <section class="view is-hidden" id="view-streamers"></section>
      <section class="view is-hidden" id="view-destinations"></section>
      <section class="view is-hidden" id="view-history"></section>
      <section class="view is-hidden" id="view-settings"></section>
    </main>
  </div>

  <div class="toast-root" id="toast-root"></div>
  <div id="modal-root"></div>
  <script src="/static/app.js"></script>
</body>
</html>
