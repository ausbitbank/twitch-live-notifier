name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Cross-compile Windows executable
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 GOAMD64=v1 \
            go build -trimpath -buildvcs=false \
            -ldflags "-s -w -H=windowsgui -buildid=" \
            -o /tmp/TwitchLiveNotifier.exe .

      - name: Build Linux dashboard executable
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -buildvcs=false \
            -ldflags "-s -w" \
            -o /tmp/TwitchLiveNotifier-linux-amd64 .

      - name: Build macOS dashboard executables
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch \
              go build -trimpath -buildvcs=false \
              -ldflags "-s -w" \
              -o /tmp/TwitchLiveNotifier-macos-$arch .
          done

      - name: Build Docker image
        run: docker build -t twitch-live-notifier:ci .
