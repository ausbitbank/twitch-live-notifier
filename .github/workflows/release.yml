name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: |
          go test -race ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...

      - name: Install go-winres
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          go-winres make --in winres/winres.json --arch amd64 --out rsrc --product-version "$version" --file-version "$version"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 GOAMD64=v1 \
            go build -trimpath -buildvcs=false \
            -ldflags "-s -w -H=windowsgui -buildid= -X main.Version=${version}" \
            -o dist/TwitchLiveNotifier.exe .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.Version=${version}" \
            -o dist/TwitchLiveNotifier-linux-amd64 .
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch \
              go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.Version=${version}" \
              -o "dist/TwitchLiveNotifier-macos-$arch" .
          done
          cp README.md LICENSE dist/
          mkdir -p dist/docs
          cp docs/*.png dist/docs/

      - name: Package Linux
        run: |
          version="${GITHUB_REF_NAME#v}"
          curl -fsSL -o dist/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x dist/appimagetool-x86_64.AppImage
          ./packaging/linux/build-deb.sh "$version" dist/TwitchLiveNotifier-linux-amd64 amd64
          APPIMAGETOOL="$PWD/dist/appimagetool-x86_64.AppImage" \
            ./packaging/linux/build-appimage.sh "$version" dist/TwitchLiveNotifier-linux-amd64 x86_64

      - name: Package macOS app bundles
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./packaging/macos/build-app.sh "$version" amd64 dist/TwitchLiveNotifier-macos-amd64
          ./packaging/macos/build-app.sh "$version" arm64 dist/TwitchLiveNotifier-macos-arm64

      - name: Create archives and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd dist
          zip -r "TwitchLiveNotifier-${GITHUB_REF_NAME}-Windows-x64.zip" \
            TwitchLiveNotifier.exe README.md LICENSE docs/*.png
          tar -czf "TwitchLiveNotifier-${GITHUB_REF_NAME}-Linux-x64.tar.gz" \
            TwitchLiveNotifier-linux-amd64 "TwitchLiveNotifier-v${version}-Linux-x64.deb" \
            "TwitchLiveNotifier-v${version}-Linux-x64.AppImage" README.md LICENSE docs
          tar -czf "TwitchLiveNotifier-${GITHUB_REF_NAME}-macOS.tar.gz" \
            TwitchLiveNotifier-macos-amd64 TwitchLiveNotifier-macos-arm64 \
            macos-amd64 macos-arm64 README.md LICENSE docs
          sha256sum TwitchLiveNotifier.exe TwitchLiveNotifier-linux-amd64 \
            TwitchLiveNotifier-macos-amd64 TwitchLiveNotifier-macos-arm64 \
            "TwitchLiveNotifier-v${version}-Linux-x64.deb" \
            "TwitchLiveNotifier-v${version}-Linux-x64.AppImage" \
            "TwitchLiveNotifier-${GITHUB_REF_NAME}-Windows-x64.zip" \
            "TwitchLiveNotifier-${GITHUB_REF_NAME}-Linux-x64.tar.gz" \
            "TwitchLiveNotifier-${GITHUB_REF_NAME}-macOS.tar.gz" > SHA256SUMS.txt

      - name: Render Homebrew formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          curl -fsSL -o dist/source.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          ./packaging/homebrew/render.sh "$version" dist/source.tar.gz dist/homebrew/twitch-live-notifier.rb
          (cd dist/homebrew && sha256sum twitch-live-notifier.rb >> ../SHA256SUMS.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TwitchLiveNotifier.exe
            dist/TwitchLiveNotifier-linux-amd64
            dist/TwitchLiveNotifier-macos-amd64
            dist/TwitchLiveNotifier-macos-arm64
            dist/TwitchLiveNotifier-${{ github.ref_name }}-Windows-x64.zip
            dist/TwitchLiveNotifier-${{ github.ref_name }}-Linux-x64.tar.gz
            dist/TwitchLiveNotifier-${{ github.ref_name }}-macOS.tar.gz
            dist/TwitchLiveNotifier-v${{ steps.version.outputs.version }}-Linux-x64.deb
            dist/TwitchLiveNotifier-v${{ steps.version.outputs.version }}-Linux-x64.AppImage
            dist/homebrew/twitch-live-notifier.rb
            dist/SHA256SUMS.txt
          generate_release_notes: true

  packaging-secrets:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.check.outputs.macos }}
    steps:
      - id: check
        env:
          MACOS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        run: |
          if [ -n "$MACOS_CERT" ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi

  windows-installer:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install go-winres
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          echo "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build, sign, and package Windows artifacts
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $version = "${{ needs.release.outputs.version }}"
          go-winres make --in winres/winres.json --arch amd64 --out rsrc --product-version $version --file-version $version
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:GOAMD64 = "v1"
          go build -trimpath -buildvcs=false `
            -ldflags "-s -w -H=windowsgui -buildid= -X main.Version=$version" `
            -o dist/TwitchLiveNotifier.exe .
          ./packaging/windows/build-installer.ps1 -Version $version -ExePath "dist/TwitchLiveNotifier.exe"

      - name: Build Windows ZIP
        shell: pwsh
        run: |
          $version = "${{ needs.release.outputs.version }}"
          Copy-Item README.md, LICENSE -Destination dist -Force
          New-Item -ItemType Directory -Force -Path dist/docs | Out-Null
          Copy-Item docs/*.png -Destination dist/docs -Force
          Remove-Item "dist/TwitchLiveNotifier-$env:GITHUB_REF_NAME-Windows-x64.zip" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/TwitchLiveNotifier.exe, dist/README.md, dist/LICENSE, dist/docs -DestinationPath "dist/TwitchLiveNotifier-$env:GITHUB_REF_NAME-Windows-x64.zip" -Force

      - name: Build winget manifests
        shell: bash
        run: |
          version="${{ needs.release.outputs.version }}"
          ./packaging/winget/render.sh "$version" "dist/installer/TwitchLiveNotifier-v${version}-Windows-x64-Setup.exe" dist/winget
          cd dist
          powershell -NoProfile -Command "Compress-Archive -Path 'winget/*' -DestinationPath 'TwitchLiveNotifier-v${version}-winget.zip' -Force"

      - name: Update checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.release.outputs.version }}"
          cd dist
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS.txt --dir . --clobber
          grep -v -E 'TwitchLiveNotifier\.exe$|Windows-x64\.zip$' SHA256SUMS.txt > SHA256SUMS.tmp
          sha256sum TwitchLiveNotifier.exe \
            "TwitchLiveNotifier-${GITHUB_REF_NAME}-Windows-x64.zip" \
            "installer/TwitchLiveNotifier-v${version}-Windows-x64-Setup.exe" \
            "TwitchLiveNotifier-v${version}-winget.zip" | sed 's#installer/##' >> SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS.txt

      - name: Upload Windows artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.release.outputs.version }}"
          gh release upload "$GITHUB_REF_NAME" \
            "dist/installer/TwitchLiveNotifier-v${version}-Windows-x64-Setup.exe" \
            dist/TwitchLiveNotifier.exe \
            "dist/TwitchLiveNotifier-${GITHUB_REF_NAME}-Windows-x64.zip" \
            "dist/TwitchLiveNotifier-v${version}-winget.zip" \
            dist/SHA256SUMS.txt --clobber

  macos-sign:
    needs: [release, packaging-secrets, windows-installer]
    if: needs.packaging-secrets.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract macOS archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" \
            --pattern "TwitchLiveNotifier-${GITHUB_REF_NAME}-macOS.tar.gz" \
            --dir dist --clobber
          tar -xzf "dist/TwitchLiveNotifier-${GITHUB_REF_NAME}-macOS.tar.gz" -C dist

      - name: Sign and notarize app bundles
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ./packaging/macos/sign-and-notarize.sh "dist/macos-amd64/Twitch Live to Discord.app"
          ./packaging/macos/sign-and-notarize.sh "dist/macos-arm64/Twitch Live to Discord.app"

      - name: Repack and update checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          tar -czf "TwitchLiveNotifier-${GITHUB_REF_NAME}-macOS.tar.gz" \
            TwitchLiveNotifier-macos-amd64 TwitchLiveNotifier-macos-arm64 \
            macos-amd64 macos-arm64 README.md LICENSE docs
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS.txt --dir . --clobber
          grep -v "macOS.tar.gz$" SHA256SUMS.txt > SHA256SUMS.tmp
          shasum -a 256 "TwitchLiveNotifier-${GITHUB_REF_NAME}-macOS.tar.gz" >> SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS.txt

      - name: Upload signed macOS archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/TwitchLiveNotifier-${GITHUB_REF_NAME}-macOS.tar.gz" \
            dist/SHA256SUMS.txt --clobber

  docker:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and publish multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
